[package]
name = "matrixcode"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Ultra-light terminal coding agent for Codex and Claude"
license = "MIT"
repository = "https://github.com/matrixdurden/matrixcode"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events", "windows"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true
strip = false
