name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  format-benchmark:
    if: github.event_name == 'pull_request' && github.head_ref == 'phase/performance-baseline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: rustfmt --edition 2024 tools/bench_linux.rs
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- tools/bench_linux.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/bench_linux.rs
          git commit -m "format benchmark harness"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --all-targets --locked

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: ls -lh target/release/matrixcode

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo build --release --locked
      - run: rustfmt --edition 2024 --check tools/bench_linux.rs
      - run: rustc --edition 2024 -O -D warnings tools/bench_linux.rs -o target/bench-linux
      - run: target/bench-linux target/release/matrixcode 10 target/matrixcode-benchmark.json
      - run: cat target/matrixcode-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: matrixcode-linux-benchmark
          path: target/matrixcode-benchmark.json
          retention-days: 14
